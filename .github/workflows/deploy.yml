name: Deploy to Chrome Web Store

on:
  pull_request:
    branches:
      - release
    types: [closed]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      # Runs before the version bump on purpose: a missing or malformed
      # credential must not burn a version number. Prints lengths only —
      # never the values — so a truncated or swapped secret is obvious.
      - name: Verify store credentials
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          missing=0
          for name in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or not set in repository secrets"
              missing=1
            else
              echo "$name: ${#value} chars"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # GitHub stores a secret byte for byte, including a trailing newline
          # left over from a copy-paste. Google rejects such a value with the
          # same "invalid_client" it uses for a genuinely wrong secret, so an
          # invisible character is indistinguishable from a bad credential.
          for name in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            value="${!name}"
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            if [ "$value" != "$trimmed" ]; then
              echo "::warning::$name contains whitespace (${#value} chars raw vs ${#trimmed} trimmed) — it is trimmed before use, but fix the secret"
            fi
          done

          case "$CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::warning::CLIENT_ID does not end with .apps.googleusercontent.com" ;;
          esac
          case "$REFRESH_TOKEN" in
            1//*) ;;
            *) echo "::warning::REFRESH_TOKEN does not start with 1// — is this the right value?" ;;
          esac
          case "$CLIENT_SECRET" in
            GOCSPX-*) ;;
            *) echo "::warning::CLIENT_SECRET does not start with GOCSPX- — is this an OAuth client secret?" ;;
          esac

          # A well-formed secret can still be the wrong one. Exchange the
          # refresh token for an access token now — the call the upload makes
          # first — so a rejected credential fails here, before a version is
          # bumped and pushed. Only Google's error is printed, never a token.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          response="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$(trim "$CLIENT_ID")" \
            --data-urlencode "client_secret=$(trim "$CLIENT_SECRET")" \
            --data-urlencode "refresh_token=$(trim "$REFRESH_TOKEN")" \
            --data-urlencode "grant_type=refresh_token" || true)"
          if ! printf '%s' "$response" | jq -e '.access_token' >/dev/null 2>&1; then
            error="$(printf '%s' "$response" | jq -r '.error // empty' 2>/dev/null || true)"
            description="$(printf '%s' "$response" | jq -r '.error_description // empty' 2>/dev/null || true)"
            echo "::error::Google rejected the store credentials: ${error:-no response} ${description:+— $description}"
            case "$error" in
              invalid_client) echo "CLIENT_ID or CLIENT_SECRET is wrong — copy a current secret of this OAuth client from Google Cloud Console." ;;
              invalid_grant) echo "REFRESH_TOKEN is expired, revoked, or was issued for another OAuth client — generate a new one." ;;
            esac
            exit 1
          fi
          echo "Store credentials accepted by Google"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bump version in manifest
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          CURRENT=$(jq -r .version manifest.json)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major)
              NEW="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch|*)
              NEW="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          echo "Bumping version: $CURRENT -> $NEW (type: $BUMP_TYPE)"
          jq ".version = \"$NEW\"" manifest.json > tmp.json && mv tmp.json manifest.json

          # Expose the new version to subsequent steps
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      - name: Commit and push new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin release

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/manifest.json" ]; then
            echo "manifest.json not found in dist/"
            exit 1
          fi
          BUILD_VERSION=$(jq -r .version dist/manifest.json)
          echo "Build verified — version: $BUILD_VERSION"

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../extension.zip . -x "*.DS_Store" "*.map"
          cd ..
          echo "ZIP size: $(du -h extension.zip | cut -f1)"

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          # Defensive trim — see the note in the preflight step.
          EXTENSION_ID="$(printf '%s' "$EXTENSION_ID" | tr -d '[:space:]')"
          CLIENT_ID="$(printf '%s' "$CLIENT_ID" | tr -d '[:space:]')"
          CLIENT_SECRET="$(printf '%s' "$CLIENT_SECRET" | tr -d '[:space:]')"
          REFRESH_TOKEN="$(printf '%s' "$REFRESH_TOKEN" | tr -d '[:space:]')"

          npx chrome-webstore-upload-cli@3 upload \
            --source extension.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish

      - name: Tag release
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Summary
        if: success()
        run: |
          echo "### Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title**: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: @${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
